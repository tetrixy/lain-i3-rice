# ============================================================================
# Alacritty config — Serial Experiments Lain rice
# Source: https://alacritty.org/config-alacritty.html
# Font: JetBrains Mono — full Cyrillic support
# Format: TOML (required since Alacritty 0.13.0)
# ============================================================================

# --- Window ---
[window]
padding = { x = 8, y = 8 }
dynamic_padding = true
decorations = "None"
opacity = 0.95

# --- Font ---
# JetBrains Mono: monospace with Cyrillic glyphs
# Source: https://www.jetbrains.com/lp/mono/
[font]
size = 10.0

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrains Mono"
style = "Bold Italic"

[font.offset]
x = 0
y = 0

# --- Colors (Lain palette) ---
# Source: designbycurio.com + Serial Experiments Lain screencaps
[colors.primary]
background = "#0d0f14"
foreground = "#b8c0cc"
dim_foreground = "#6b7280"
bright_foreground = "#d4dae4"

[colors.normal]
black   = "#0d0f14"
red     = "#6b2d3c"
green   = "#4a7c59"
yellow  = "#8b7355"
blue    = "#3d5a80"
magenta = "#4d353c"
cyan    = "#4a7c59"
white   = "#b8c0cc"

[colors.bright]
black   = "#1a1d24"
red     = "#8b3a4a"
green   = "#39ff14"
yellow  = "#c4a35a"
blue    = "#5a8ab4"
magenta = "#6b4d5c"
cyan    = "#5a9c6f"
white   = "#d4dae4"

[colors.dim]
black   = "#0a0c10"
red     = "#4d353c"
green   = "#3a5c44"
yellow  = "#6b5a3d"
blue    = "#2d4460"
magenta = "#3d2a30"
cyan    = "#3a5c44"
white   = "#8890a0"

[colors.cursor]
text   = "#0d0f14"
cursor = "#39ff14"

[colors.selection]
text       = "#b8c0cc"
background = "#1a1d24"

# --- Cursor ---
[cursor]
blink_interval = 500

[cursor.style]
shape = "Block"
blinking = "On"

# --- Mouse ---
[mouse]
hide_when_typing = true

# --- Selection ---
[selection]
save_to_clipboard = true

# --- Bell ---
[bell]
animation = "EaseOutExpo"
duration = 100
color = "#6b2d3c"

# --- Scrolling ---
[scrolling]
history = 10000
multiplier = 3

# --- Key bindings ---
[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"
