# ============================================================================
# MPD (Music Player Daemon) config — Serial Experiments Lain rice
# Source: https://wiki.archlinux.org/title/Music_Player_Daemon
# ============================================================================

# Music directory
music_directory "~/Music"
playlist_directory "~/.config/mpd/playlists"
db_file "~/.config/mpd/database"
log_file "~/.config/mpd/log"
pid_file "~/.config/mpd/pid"
state_file "~/.config/mpd/state"
sticker_file "~/.config/mpd/sticker.sql"

# Network
bind_to_address "127.0.0.1"
port "6600"

# Audio output (PipeWire via pipewire-pulse)
# PipeWire provides PulseAudio-compatible interface
audio_output {
    type "pulse"
    name "PipeWire"
}

# Audio output (ALSA fallback — also works via pipewire-alsa)
# audio_output {
#     type "alsa"
#     name "ALSA"
# }

# Database
auto_update "yes"
auto_update_depth "3"

# Metadata
follow_outside_symlinks "yes"
follow_inside_symlinks "yes"

# Gapless playback
gapless_mp3_playback "yes"

# Replay gain
replaygain "album"
replaygain_preamp "0"

# Zeroconf (optional)
# zeroconf_name "MPD on %h"
# zeroconf_enabled "no"

# Permissions
# default_permissions "read,add,control,admin"
