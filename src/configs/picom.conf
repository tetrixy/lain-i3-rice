# ============================================================================
# Picom compositor config — Serial Experiments Lain rice
# Source: https://wiki.archlinux.org/title/Picom
# Effect: subtle CRT scanlines via dithering, no heavy blur
# ============================================================================

# --- Backend ---
backend = "glx";
vsync = true;

# --- Shadows ---
# Disabled for clean Lain aesthetic — readability over decoration
shadow = false;

# --- Fading ---
# Subtle fade for that "signal processing" feel
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-exclude = [];

# --- Transparency / Opacity ---
# Slight transparency for unfocused windows
inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# --- Corner radius ---
# No rounded corners — Lain is angular
corner-radius = 0;

# --- Blur ---
# No blur — keep text sharp and readable
blur: {
  method = "none";
};

# --- Window rules ---
opacity-rule = [
  "90:class_g = 'Alacritty'",
  "100:class_g = 'i3-frame'"
];

# --- Dithering (CRT film grain effect) ---
# This creates the subtle noise/static texture
dithered-present = true;

# --- Focus/exclude ---
focus-exclude = [
  "class_g = 'Dunst'",
  "class_g = 'Rofi'"
];

# --- Detect rounded corners ---
detect-rounded-corners = false;

# --- OpenGL ---
glx-no-stencil = true;
glx-no-rebind-pixmap = false;
use-damage = true;

# --- Unredir ---
unredir-if-possible = true;
