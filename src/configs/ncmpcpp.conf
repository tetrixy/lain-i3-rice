# ============================================================================
# ncmpcpp config — Serial Experiments Lain rice
# Source: https://wiki.archlinux.org/title/Ncmpcpp
# ============================================================================

# MPD settings
mpd_host = "localhost"
mpd_port = 6600
mpd_music_dir = "~/Music"

# Appearance
visualizer_color = 1, 2, 3, 4, 5, 6, 7, 8
visualizer_type = spectrum
visualizer_look = ●●

# Colors (Lain palette)
# 1 = black (#0d0f14)
# 2 = red (#6b2d3c)
# 3 = green (#4a7c59)
# 4 = yellow (#8b7355)
# 5 = blue (#3d5a80)
# 6 = magenta (#4d353c)
# 7 = cyan (#4a7c59)
# 8 = white (#b8c0cc)

main_window_color = white
color1 = green
color2 = red

# Progress bar
progressbar_color = green
progressbar_elapsed_color = black

# Status bar
statusbar_color = white

# Alternative UI
alternative_ui_separator_color = black

# Columns
song_list_format = "{%a - }{%t}|{$8%f$9}$R{$3%b$9}"
song_status_format = "{{%a{ \"%b\"{ (%y)}} - }{%t}}|{%f}"
song_library_format = "{%n - }{%t}|{%f}"
song_columns_list_format = "(10)[green]{l} (30)[white]{a} (40)[white]{t} (30)[white]{b}"

# Display
playlist_display_mode = columns
browser_display_mode = columns
search_engine_display_mode = columns

# Behavior
autocenter_mode = yes
centered_cursor = yes
allow_for_physical_item_deletion = no
space_add_mode = add_remove

# Key bindings
# Default keys are fine, but you can customize:
# playlist: 1
# browser: 2
# search: 3
# playlist_editor: 4
# tag_editor: 5
# outputs: 6
# visualizer: 8
# clock: 9

# Scrolling
playlist_enable_highlight = yes
playlist_highlight_color = green
mouse_support = yes
mouse_list_scroll_whole_page = no

# Misc
incremental_seeking = yes
seek_time = 1
volume_change_step = 5
block_search_constraints_change_if_items_found = yes
media_library_left_column = a
ignore_leading_the = no
external_editor = vim
use_console_editor = yes

# Now playing
now_playing_prefix = "$b"
now_playing_suffix = "$/b"
selected_item_prefix = "$8"
selected_item_suffix = "$9"

# Lyrics
lyrics_directory = "~/.lyrics"
store_lyrics_in_song_dir = no
fetch_lyrics_in_background = yes

# Last.fm
lastfm_password = ""
lastfm_username = ""
